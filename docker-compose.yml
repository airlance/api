services:
  postgres:
    image: postgres:16-alpine
    container_name: airlance-postgres
    environment:
      POSTGRES_DB: airlance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airlance"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: airlance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: airlance-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airlance-api
    entrypoint: ["sh", "-c", "/app/airlance-api migrate up && exec /app/airlance-api serve"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://postgres:password@postgres:5432/airlance?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SMTP_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@airlance.local
      SMTP_STARTTLS: "false"
      LOG_LEVEL: debug
      LOG_FORMAT: console
      WIREAUTH_RSA_KEY_PATH: /app/wireauth_private_key.pem
    volumes:
      - ./wireauth_private_key.pem:/app/wireauth_private_key.pem:ro
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
