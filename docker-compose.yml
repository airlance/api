services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./hosts:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - airlance

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airlance
      POSTGRES_USER: airlance
      POSTGRES_PASSWORD: airlance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - airlance

  api:
    image: airlance/api:dev
    container_name: api
    ports:
      - "9090:9090"
      - "8080:8080"
    volumes:
      - .:/app
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - GRPC_TLS_KEY_PATH=/app/server.key
    depends_on:
      postgres:
        condition: service_started
    networks:
      - airlance

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    networks:
      - airlance

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  airlance:
