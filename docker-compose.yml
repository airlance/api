services:
  postgres:
    image: postgres:16-alpine
    container_name: airlance-postgres
    environment:
      POSTGRES_DB: airlance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airlance"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: airlance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airlance-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://postgres:password@postgres:5432/airlance?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: debug
      LOG_FORMAT: console
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
